<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07100b">
<title>ExpenseFlow Pro</title>
<style>
:root{--bg:#07100b;--card:#0e1b14;--card2:#12241a;--text:#f6fff5;--muted:#91a79a;--lime:#b7ff22;--lime2:#8eea00;--red:#ff6875;--blue:#62c6ff;--border:#203429}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#183b1d 0,transparent 32%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 90px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:12px}.brand b{font-size:20px}.brand span{color:var(--lime)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pill{background:#17261c;border:1px solid var(--border);padding:8px 11px;border-radius:999px;color:var(--muted)}.card{background:linear-gradient(145deg,var(--card),#0b1711);border:1px solid var(--border);border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 14px 40px #0004}.balance{font-size:34px;font-weight:800;margin:6px 0}.muted{color:var(--muted)}.lime{color:var(--lime)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;background:#0b1711;border:1px solid var(--border);border-radius:16px}.stat strong{display:block;font-size:20px;margin-top:5px}.nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(680px,calc(100% - 20px));display:flex;gap:5px;padding:8px;background:#09130df2;backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:20px;z-index:10}.nav button{flex:1;background:transparent;color:var(--muted);border:0;padding:9px 4px;border-radius:14px}.nav button.active{background:#1c321c;color:var(--lime)}.fab{background:var(--lime)!important;color:#081008!important;font-weight:900}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tx{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #ffffff0b}.tx:last-child{border:0}.cat{display:flex;align-items:center;gap:10px}.dot{width:36px;height:36px;border-radius:12px;background:#1a3020;display:grid;place-items:center}.income{color:#75e7a3}.expense{color:#ff7f8a}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--lime);color:#091009;font-weight:800}.btn.secondary{background:#18271d;color:var(--text);border:1px solid var(--border)}.btn.danger{background:#32161a;color:#ff9aa3}.form{display:grid;gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:13px;border-radius:13px;border:1px solid var(--border);background:#09150e;color:var(--text);outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lime)}.actions{display:flex;gap:8px}.actions>*{flex:1}.auth{min-height:100vh;display:grid;place-items:center;padding:25px}.authbox{width:min(430px,100%)}.hero{text-align:center;margin-bottom:25px}.hero img{width:90px;height:90px;border-radius:25px}.hero h1{margin:10px 0 3px}.screen-title{font-size:25px;font-weight:800;margin:5px 0 16px}.empty{text-align:center;padding:28px;color:var(--muted)}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#dfffaa;color:#0b1409;padding:11px 15px;border-radius:12px;font-weight:700;z-index:20}.bar{height:8px;background:#18281d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}.chart{display:flex;align-items:end;gap:7px;height:145px;padding-top:15px}.chart div{flex:1;background:linear-gradient(#b7ff22,#4e8711);border-radius:8px 8px 2px 2px;min-height:8px}.small{font-size:12px}.hide{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const {createClient}=supabase;
const db=createClient(EXPENSEFLOW_CONFIG.supabaseUrl,EXPENSEFLOW_CONFIG.supabasePublishableKey);
const cats=['Food','Transport','Shopping','Bills','Entertainment','Education','Health','Travel','Other'];
let state={user:null,tab:'home',expenses:[],income:[],budgets:[],profile:null,loading:false};

const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:state.profile?.currency||'INR',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=m=>{let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
const today=()=>new Date().toISOString().slice(0,10);
async function load(){
  const {data:{session}}=await db.auth.getSession(); state.user=session?.user||null;
  if(!state.user){render();return}
  const uid=state.user.id;
  const [p,e,i,b]=await Promise.all([
    db.from('profiles').select('*').eq('id',uid).maybeSingle(),
    db.from('expenses').select('*').eq('user_id',uid).order('date',{ascending:false}).limit(200),
    db.from('income').select('*').eq('user_id',uid).order('date',{ascending:false}).limit(200),
    db.from('budgets').select('*').eq('user_id',uid).order('year',{ascending:false}).order('month',{ascending:false})
  ]);
  state.profile=p.data||{full_name:state.user.user_metadata?.full_name||'User',currency:'INR'};
  state.expenses=e.data||[]; state.income=i.data||[]; state.budgets=b.data||[];
  render();
}
function render(){document.getElementById('root').innerHTML=state.user?app():auth()}
function auth(){return `<div class="auth"><div class="authbox"><div class="hero"><img src="expenseflow_logo.png"><h1>ExpenseFlow <span class="lime">Pro</span></h1><div class="muted">Track • Plan • Grow</div></div><div class="card"><div class="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><div id="nameWrap" class="field hide"><label>Full name</label><input id="name"></div><button class="btn" onclick="login()">Sign in</button><button class="btn secondary" onclick="signup()">Create account</button><button class="btn secondary" onclick="resetPass()">Forgot password</button></div></div><p class="muted small" style="text-align:center">Your financial data is protected by Supabase authentication and database RLS.</p></div></div>`}
async function login(){const email=emailEl(),password=passEl();const {error}=await db.auth.signInWithPassword({email,password});if(error)return toast(error.message);await load()}
async function signup(){const email=emailEl(),password=passEl(),name=document.getElementById('name')?.value||'';const {error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)return toast(error.message);toast('Account created. Check email if confirmation is enabled.');await load()}
async function resetPass(){const email=emailEl();if(!email)return toast('Enter your email first');const {error}=await db.auth.resetPasswordForEmail(email);toast(error?error.message:'Password reset email sent')}
const emailEl=()=>document.getElementById('email')?.value.trim(),passEl=()=>document.getElementById('pass')?.value;
db.auth.onAuthStateChange(()=>setTimeout(load,0));

function app(){let content={home:home,expenses:expenses,income:income,budgets:budgets,reports:reports,profile:profile}[state.tab]();return `<div class="app"><div class="top"><div class="brand"><img src="expenseflow_logo.png"><div><b>Expense<span>Flow</span></b><div class="small muted">Pro</div></div></div><div class="pill">${esc(state.profile?.full_name?.split(' ')[0]||'User')}</div></div>${content}</div>${nav()}`}
function nav(){return `<div class="nav">${[['home','⌂','Home'],['expenses','↘','Expenses'],['+','＋','Add'],['reports','◔','Reports'],['profile','◉','Profile']].map(x=>x[0]=='+'?`<button class="fab" onclick="addTx()">＋</button>`:`<button class="${state.tab==x[0]?'active':''}" onclick="state.tab='${x[0]}';render()">${x[1]}<div class="small">${x[2]}</div></button>`).join('')}</div>`}
function home(){let inc=sum(state.income),exp=sum(state.expenses),bal=inc-exp;return `<div class="screen-title">Dashboard</div><div class="card"><div class="muted">Total Balance</div><div class="balance">${money(bal)}</div><div class="lime small">Track • Plan • Grow</div></div><div class="grid"><div class="stat"><div class="muted">Income</div><strong class="income">${money(inc)}</strong></div><div class="stat"><div class="muted">Expenses</div><strong class="expense">${money(exp)}</strong></div></div><div class="card"><div class="row"><b>Recent transactions</b><button class="pill" onclick="state.tab='expenses';render()">See all</button></div>${recent()}</div><div class="card"><b>Monthly snapshot</b>${monthSummary()}</div>`}
function recent(){let a=[...state.expenses.map(x=>({...x,_t:'expense',title:x.title})),...state.income.map(x=>({...x,_t:'income',title:x.source}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);return a.length?a.map(x=>`<div class="tx"><div class="cat"><div class="dot">${x._t==='income'?'↗':'↘'}</div><div><b>${esc(x.title)}</b><div class="small muted">${esc(x.category||'Other')} • ${esc(x.date)}</div></div></div><b class="${x._t==='income'?'income':'expense'}">${x._t==='income'?'+':'-'}${money(x.amount)}</b></div>`).join(''):`<div class="empty">No transactions yet.</div>`}
function monthSummary(){let d=new Date(),m=d.getMonth(),y=d.getFullYear(),e=state.expenses.filter(x=>new Date(x.date).getMonth()===m&&new Date(x.date).getFullYear()===y);let total=sum(e);return `<div style="margin-top:12px"><div class="row"><span class="muted">This month</span><b>${money(total)}</b></div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,total/50000*100)}%"></i></div></div>`}
function expenses(){return listPage('Expenses',state.expenses,false)}
function income(){return listPage('Income',state.income,true)}
function listPage(title,arr,isIncome){return `<div class="screen-title">${title}<button class="btn" style="float:right;padding:8px 12px" onclick="addTx(${isIncome?'true':'false'})">＋</button></div><div class="card"><div class="field"><label>Search</label><input placeholder="Search..." oninput="filterList(this.value,${isIncome})"></div><div id="list">${renderList(arr,isIncome)}</div></div>`}
function renderList(arr,isIncome){return arr.length?arr.map(x=>`<div class="tx"><div class="cat"><div class="dot">${isIncome?'↗':'↘'}</div><div><b>${esc(isIncome?x.source:x.title)}</b><div class="small muted">${esc(x.category||'Other')} • ${esc(x.date)}</div></div></div><div style="text-align:right"><b class="${isIncome?'income':'expense'}">${isIncome?'+':'-'}${money(x.amount)}</b><br><button class="pill small" onclick="delTx('${x.id}',${isIncome})">Delete</button></div></div>`).join(''):`<div class="empty">Nothing here yet.</div>`}
function filterList(q,isIncome){let arr=(isIncome?state.income:state.expenses).filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));document.getElementById('list').innerHTML=renderList(arr,isIncome)}
async function addTx(isIncome=false){let title=isIncome?'Add Income':'Add Expense';document.getElementById('root').innerHTML=`<div class="app"><div class="top"><button class="pill" onclick="render()">← Back</button><b>${title}</b><span></span></div><div class="card"><div class="form"><div class="field"><label>${isIncome?'Source':'Title'}</label><input id="txTitle"></div><div class="field"><label>Amount</label><input id="txAmount" type="number" min="0.01" step="0.01"></div><div class="field"><label>Category</label><select id="txCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="txDate" type="date" value="${today()}"></div><div class="field"><label>Note</label><textarea id="txNote" rows="3"></textarea></div>${!isIncome?`<div class="field"><label>Payment method</label><select id="txPay">${['Cash','UPI','Card','Bank Transfer','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div>`:''}<button class="btn" onclick="saveTx(${isIncome})">Save</button></div></div></div>`}
async function saveTx(isIncome){let payload={user_id:state.user.id,amount:Number(document.getElementById('txAmount').value),category:document.getElementById('txCat').value,date:document.getElementById('txDate').value,description:document.getElementById('txNote').value};if(!payload.amount||payload.amount<=0)return toast('Enter a valid amount');let res;if(isIncome)res=await db.from('income').insert({...payload,source:document.getElementById('txTitle').value}).select().single();else res=await db.from('expenses').insert({...payload,title:document.getElementById('txTitle').value,payment_method:document.getElementById('txPay').value}).select().single();if(res.error)return toast(res.error.message);toast('Saved');await load()}
async function delTx(id,isIncome){if(!confirm('Delete this transaction?'))return;let t=isIncome?'income':'expenses',r=await db.from(t).delete().eq('id',id).eq('user_id',state.user.id);if(r.error)return toast(r.error.message);await load()}
function budgets(){let now=new Date(),rows=cats.map(c=>{let b=state.budgets.find(x=>x.category===c&&x.month===now.getMonth()+1&&x.year===now.getFullYear());let used=sum(state.expenses.filter(x=>x.category===c&&new Date(x.date).getMonth()===now.getMonth()&&new Date(x.date).getFullYear()===now.getFullYear()));return {c,b,used}});return `<div class="screen-title">Budgets <button class="btn" style="float:right;padding:8px 12px" onclick="addBudget()">＋</button></div>${rows.map(r=>`<div class="card"><div class="row"><b>${r.c}</b><span>${money(r.used)} / ${money(r.b?.amount||0)}</span></div><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,r.b?100*r.used/r.b.amount:0)}%"></i></div></div>`).join('')}`}
async function addBudget(){let c=prompt('Category:',cats[0]);if(!c)return;let a=Number(prompt('Monthly budget amount:'));if(!a)return;let d=new Date(),r=await db.from('budgets').upsert({user_id:state.user.id,category:c,amount:a,month:d.getMonth()+1,year:d.getFullYear()},{onConflict:'user_id,category,month,year'});if(r.error)return toast(r.error.message);await load()}
function reports(){let exp=sum(state.expenses),inc=sum(state.income);let by=cats.map(c=>[c,sum(state.expenses.filter(x=>x.category===c))]).sort((a,b)=>b[1]-a[1]);let max=Math.max(...by.map(x=>x[1]),1);return `<div class="screen-title">Reports</div><div class="grid"><div class="stat"><div class="muted">Income</div><strong class="income">${money(inc)}</strong></div><div class="stat"><div class="muted">Spending</div><strong class="expense">${money(exp)}</strong></div></div><div class="card"><b>Spending by category</b>${by.map(x=>`<div style="margin-top:12px"><div class="row"><span>${x[0]}</span><span>${money(x[1])}</span></div><div class="bar"><i style="width:${x[1]/max*100}%"></i></div></div>`).join('')}</div>`}
function profile(){return `<div class="screen-title">Profile</div><div class="card"><div class="form"><div class="field"><label>Full name</label><input id="fullName" value="${esc(state.profile?.full_name||'')}"></div><div class="field"><label>Currency</label><select id="currency"><option ${state.profile?.currency==='INR'?'selected':''}>INR</option><option ${state.profile?.currency==='USD'?'selected':''}>USD</option><option ${state.profile?.currency==='EUR'?'selected':''}>EUR</option></select></div><button class="btn" onclick="saveProfile()">Save profile</button><button class="btn danger" onclick="logout()">Sign out</button></div></div><div class="card"><b>ExpenseFlow Pro</b><p class="muted">Secure personal finance tracking with Supabase authentication and row-level security.</p></div>`}
async function saveProfile(){let r=await db.from('profiles').update({full_name:document.getElementById('fullName').value,currency:document.getElementById('currency').value,updated_at:new Date().toISOString()}).eq('id',state.user.id);if(r.error)return toast(r.error.message);toast('Profile saved');await load()}
async function logout(){await db.auth.signOut();state.user=null;render()}
function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
load();
</script>
</body>
</html>
